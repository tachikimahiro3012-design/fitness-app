name: Keep Streamlit app awake

# Streamlit Community Cloud は12時間アクセスがないとアプリをスリープさせる。
# 6時間おきにブラウザでアプリを開き、スリープ中なら起こすボタンを押して、
# 「アクセスがあった」状態を保つ。
on:
  schedule:
    - cron: "0 */6 * * *"   # 6時間おき(UTC。日本時間では 9:00 / 15:00 / 21:00 / 3:00 ごろ)
  workflow_dispatch:         # Actions タブから手動でも実行できる

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Open the app (wake it up if sleeping)
        env:
          STREAMLIT_APP_URL: https://fitness-app-3sixsf9bwqq3mvo5kg9uxu.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import sys
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          URL = os.environ["STREAMLIT_APP_URL"]
          WAKE_TEXT = "Yes, get this app back up!"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              try:
                  page.goto(URL, wait_until="domcontentloaded", timeout=60_000)

                  # スリープ中なら、起こすボタンを押す
                  try:
                      page.get_by_role("button", name=WAKE_TEXT).click(timeout=15_000)
                      print("App was asleep: clicked the wake-up button")
                  except PWTimeout:
                      print("No wake-up button: app is already awake")

                  # アプリ本体(iframe内)が表示されるまで待つ。起動には数分かかることがある
                  app = page.frame_locator('iframe[title="streamlitApp"]').locator('[data-testid="stApp"]')
                  app.wait_for(timeout=180_000)
                  page.wait_for_timeout(10_000)  # 接続が確立するまで少し待つ
                  print("App is up")
              except PWTimeout:
                  print("App did not show up in time", file=sys.stderr)
                  sys.exit(1)
              finally:
                  browser.close()
          PY